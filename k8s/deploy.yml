---
# 1️⃣ Create a Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: full-access-sa
  namespace: default
spec:
  template:
    spec:
      containers:
        - image: praveenathmuri/java-gha:1fc831e
---
# 2️⃣ Create a ClusterRole with full access
# (same as cluster-admin role)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: full-access-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
spec:
  template:
    spec:
      containers:
        - image: praveenathmuri/java-gha:1fc831e
---
# 3️⃣ Bind the ClusterRole to the Service Account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: full-access-binding
subjects:
  - kind: ServiceAccount
    name: full-access-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: full-access-role
  apiGroup: rbac.authorization.k8s.io
spec:
  template:
    spec:
      containers:
        - image: praveenathmuri/java-gha:1fc831e
---
# 4️⃣ Create Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: boardgame-deployment
spec:
  selector:
    matchLabels:
      app: boardgame
  replicas: 2
  template:
    metadata:
      labels:
        app: boardgame
    spec:
      serviceAccountName: full-access-sa
      containers:
        - name: boardgame
          image: praveenathmuri/java-gha:1fc831e
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
---
# 5️⃣ Create Service
apiVersion: v1
kind: Service
metadata:
  name: boardgame-ssvc
spec:
  selector:
    app: boardgame
  ports:
    - protocol: "TCP"
      port: 80
      targetPort: 8080
  type: LoadBalancer
  template:
    spec:
      containers:
        - image: praveenathmuri/java-gha:1fc831e
